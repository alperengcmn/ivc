# Analysis parameters. `null` means NOT YET AGREED — downstream code must refuse
# to run a gated step while its threshold is null (see docs/00_hypothesis_and_success_criteria.md).

random_seed: 0

phase3_qc:
  min_cells_per_sample: null      # Phase 0 threshold X — to agree
  max_pct_mito: null              # Phase 0 threshold Y — set after inspecting distributions, per dataset
  min_genes_per_cell: null
  max_genes_per_cell: null
  doublet_method: scrublet

phase5_annotation:
  min_confirmed_ilc2_cells: null  # Phase 0 threshold N
  max_contamination_score: null   # Phase 0 threshold M
  min_marker_categories: 1        # pipeline rule: never define a population by a single marker

phase6_differential_expression:
  min_biological_replicates: null # Phase 0 threshold K — BLOCKED until replicate structure is known
  fdr: 0.05
  unit_of_inference: sample       # cells are never treated as independent replicates

phase7_signatures:
  freeze_before_validation: true
