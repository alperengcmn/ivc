# Conda environment for the ILC2 project.
#   conda env create -f environment.yml
#   conda activate ilc2-tri
#
name: ilc2-tri
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # core single-cell stack (Phases 3–7)
  - scanpy>=1.10          # includes sc.pp.scrublet for doublet scoring
  - scikit-image          # required by scanpy's scrublet
  - anndata
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - leidenalg             # Leiden clustering (Phase 4–5)
  - python-igraph
  - harmonypy             # available for batch evaluation; not applied (D-011)
  - statsmodels
  - gseapy                # pre-ranked GSEA (Phase 7)
  - openpyxl              # reads the GSE149854 author table (Phase 10)
  - pyyaml
  # workflow & notebooks
  - jupyterlab
  - ipykernel
  # quality
  - pytest
  - ruff
  - pip
  - pip:
      - decoupler>=2.0     # CollecTRI / PROGENy ULM (Phase 8); pip build is the maintained one
      - pydeseq2>=0.5      # differential accessibility / bulk context (Phases 9–10)
      - -e .
